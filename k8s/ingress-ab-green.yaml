apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-ab-green
spec:
  ingressClassName: nginx
  rules:
    - host: green.ab.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-canary
                port:
                  number: 5000
