apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-fitness-stable
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-fitness-shadow.default.svc.cluster.local:5000$request_uri"
    nginx.ingress.kubernetes.io/mirror-request-body: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-fitness-service
                port:
                  number: 5000
